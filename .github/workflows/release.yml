name: release

# Cut a release on a semver tag (`v0.1.0`). Produces, with no private infra:
#   - a multi-arch container image on GHCR (ghcr.io/<owner>/cora) — the
#     primary path for CI adopters (`docker pull` / `uses: docker://…`);
#   - the wheel + sdist, attached to a GitHub Release for the tag, so the
#     library API installs via the release asset or `git+…@<tag>`.
# cora is not on PyPI (the name is taken by an unrelated 2019 package); the
# container + release artifacts are the supported distribution channels.
#
# Tag to release:  git tag v0.1.0 && git push origin v0.1.0
# hatch-vcs reads the version from the tag, so the tag IS the version.
#
# After a successful release, `notify-consumers` tells each downstream repo
# that consumes cora as an installed package (rather than the container) —
# each gets a `repository_dispatch` carrying the new version + wheel
# checksum, and opens its own bump PR against itself using its own
# credentials. This repo never pushes to a consumer directly: the token in
# each `*_DISPATCH_TOKEN` secret only has enough scope to fire that one
# event, nothing more.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the GitHub Release + upload assets
  packages: write      # push the image to GHCR
  id-token: write      # keyless provenance attestation
  attestations: write  # record the build provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cora

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      wheel_sha256: ${{ steps.wheel.outputs.sha256 }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0  # hatch-vcs needs full history + tags for the version

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
          ls -l dist/

      - id: wheel
        name: Checksum the wheel
        # The bump PRs this release fans out to pin this exact digest —
        # computed once here, from the artifact that's actually published,
        # rather than each consumer (or a human) re-deriving it later.
        run: |
          WHEEL=$(ls dist/*-py3-none-any.whl)
          echo "sha256=$(shasum -a 256 "$WHEEL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE }}
          # v0.1.0 -> tags 0.1.0, 0.1, latest. `version` output is 0.1.0.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CORA_VERSION=${{ steps.meta.outputs.version }}
          provenance: true
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes \
            --notes "Container image: \`${IMAGE_REF}\` (also tagged \`${IMAGE}:${TAG#v}\`, \`${IMAGE}:latest\`)."

  notify-consumers:
    name: Notify ${{ matrix.repo }}
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        # Data, not code: adding a consumer is a one-line matrix entry, not
        # a new job. Each secret is a fine-grained PAT scoped to exactly
        # one repo with the minimum permission the dispatches endpoint
        # needs (Contents: write) — it cannot merge, approve, or touch
        # any other repo. The actual bump — branch, commit, PR, checks,
        # merge — happens entirely inside the consumer's own workflow,
        # using the consumer's own credentials. Missing a secret means the
        # matching consumer just doesn't get notified (see the `if:` on
        # the step below); it's silent for a repo that hasn't wired the
        # token yet, not a failed run.
        include:
          - repo: imlach/cluster-iac
            secret: CLUSTER_IAC_DISPATCH_TOKEN
          - repo: imlach/saison
            secret: SAISON_DISPATCH_TOKEN
          - repo: imlach/dailies-pipeline
            secret: DAILIES_PIPELINE_DISPATCH_TOKEN
    steps:
      - name: Fire repository_dispatch
        env:
          GH_TOKEN: ${{ secrets[matrix.secret] }}
          REPO: ${{ matrix.repo }}
          VERSION: ${{ needs.release.outputs.version }}
          WHEEL_SHA256: ${{ needs.release.outputs.wheel_sha256 }}
        if: env.GH_TOKEN != ''
        run: |
          set -euo pipefail
          printf '{"event_type":"cora-release","client_payload":{"version":"%s","wheel_sha256":"%s"}}' \
            "$VERSION" "$WHEEL_SHA256" \
            | gh api --method POST "repos/${REPO}/dispatches" --input -
