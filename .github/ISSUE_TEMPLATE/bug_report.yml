name: Bug report
description: Something cora did wrong — a bad review, a crash, a misfire.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for the report. For an **exploitable security issue**, do not
        use this form — file a private advisory (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What cora did, and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Review mode
      options:
        - quick (MAX_TOOL_ITERATIONS=0)
        - deep (tool loop)
        - "not sure"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Area
      description: Best guess at the affected area.
      options:
        - Review verdict / quality
        - Trigger policy / gating (TriggerPolicy)
        - Escalation (T0→T1→T2, continuation)
        - propose_patch / patch dispatch
        - Retrieval (RetrievalProvider)
        - Reporter (comment / check-run / review)
        - Config / from_env wiring
        - Packaging / install / container
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal config/env and the PR shape that triggers it. Redact secrets.
      placeholder: |
        - install: docker ghcr.io/imlach/cora:0.1.0 / pip git+…@v0.1.0
        - relevant ReviewerConfig fields or env (REVIEW_*, MAX_TOOL_ITERATIONS, …)
        - PR characteristics (size, fork?, author trust, labels)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant run output or the posted comment/check-run. Redact tokens and private content.
      render: text
  - type: input
    id: version
    attributes:
      label: cora version
      description: Container image tag, release tag, or commit SHA.
    validations:
      required: true
