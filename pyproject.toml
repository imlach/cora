[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "cora"
dynamic = ["version"]
description = "a convention-oriented review agent"
readme = "README.md"
# 3.11 is the floor cora is actually tested on (CI matrix + ruff target);
# the prior 3.10 was claimed but never exercised.
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Ross Imlach" }]
keywords = ["code-review", "pull-request", "llm", "agent", "gitops", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

# Lower-bound floors, not exact pins: cora is a library, so adopters
# resolve these against their own tree. (A deployment that needs exact
# pins can install the wheel `--no-deps` against its own lockfile.)
# Floors are the versions cora was developed and tested against.
dependencies = [
    "openai>=2.38,<3",
    "mcp[cli]>=1.27",
    "pydantic-ai-slim[openai,mcp]>=1.102",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/imlach/cora"
Repository = "https://github.com/imlach/cora"
Issues = "https://github.com/imlach/cora/issues"

[project.scripts]
cora = "cora.__main__:main"

[project.optional-dependencies]
# Telemetry is opt-in — the engine imports opentelemetry lazily.
otel = [
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
]
dev = [
    "pytest",
    # Pinned, not floating. ruff's DEFAULT rule set widens between
    # releases, so an unpinned dev dep meant `ruff check .` reported a
    # different set of rules on every machine and every CI run — 251
    # findings had accumulated against a lint nobody could reproduce.
    # Bump deliberately, with the diff that comes with it.
    "ruff==0.16.2",
    "build",
]

# Per-commit versions (issue #4): `git describe`-derived, e.g.
# `0.0.1.dev42+g1a2b3c4` — unique per commit, so re-installing a
# re-vendored wheel is never a same-version pip no-op (the stale-wheel
# trap DEC-113 hit). The fallback covers tarball/no-git builds.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.hatch.build.hooks.vcs]
version-file = "src/cora/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cora"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

# Explicit selection, so the enabled set is a decision rather than
# whatever this ruff version happens to default to.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "SIM", "RUF", "TRY", "BLE"]
ignore = [
    # House style, deliberately kept:
    # Comments and docstrings are wrapped by hand for readability;
    # code lines run long where breaking them would hurt. 143 hits, none
    # of them a readability problem worth a reflow of the whole tree.
    "E501",
    # `raise RuntimeError(f"command failed (rc={rc}): ...")` is the
    # idiom throughout — the message IS the diagnostic. 50 hits.
    "TRY003",
    # En-dashes, arrows and box-drawing in prose comments are
    # intentional; they are what makes the module docstrings readable.
    "RUF001", "RUF002", "RUF003",
    # `try: ... except X: pass` is the engine's soft-fail idiom, and each
    # site carries a comment saying why the failure is tolerated.
    # `contextlib.suppress` would hide that comment inside a `with`.
    "SIM105",
    # Wants TypeError where the code raises ValueError/RuntimeError on a
    # type check. Swapping an exception type is a behaviour change for
    # anyone catching it — out of scope for a lint-enablement change.
    "TRY004",
    # `return` inside `try` rather than `else`. Pure style, and moving
    # returns out of the try block reads worse where the try is short.
    "TRY300",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
